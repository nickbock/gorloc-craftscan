# Pushing a version tag (for example 1.0.1) runs CI, then packages the addon and
# uploads it to CurseForge, Wago and a GitHub release. Tags containing "alpha" or
# "beta" are uploaded as alpha/beta files.
name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the changelog and previous-tag lookup
      - uses: BigWigsMods/packager@v2
